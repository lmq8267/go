name: 部署 Go 工具链 (可复用)

# =============================================================================
# 可复用工作流: 供其他仓库/其他 CI 以 job 方式直接引用本仓库,
# 自动下载并部署「当前/指定仓库」最新 Release 的 Go 工具链(linux/amd64),
# 安装到全局 /usr/local/go、写入 PATH/GOROOT,并通过 outputs 输出
# GOROOT / 版本 / Release 链接,供调用方后续 job 使用。
# 全程中文彩色日志输出。
#
# 在其他仓库 CI 中引用(job 级):
#   jobs:
#     deploy-go:
#       uses: <发布G工具链的仓库>/.github/workflows/deploy-go.yml@main
#       with:
#         source-repo: <发布G工具链的仓库>       # 跨仓库部署必须传入
#         tag: ''                                # 留空 = 最新 Release
#         install-dir: /usr/local/go
#     build:
#       needs: deploy-go
#       runs-on: ubuntu-latest
#       steps:
#         - run: echo "${{ needs.deploy-go.outputs.go-root }}/bin" >> $GITHUB_PATH
#         - run: go version
#
# ⚠️ 作用域说明(演示关键限制): 可复用工作流是独立 job,其内部写入的 PATH/GOROOT
#    不会自动传给调用方其他 job。调用方需通过上方方式(outputs.go-root)在自己的
#    需要 go 的 job 中追加 PATH。
#    ✔ 若希望「同一 job」后续步骤直接使用 go 命令,请引用仓库根入口 action:
#        - uses: <发布仓库>@main   (核心脚本 scripts/deploy-go.sh,见 README)
# =============================================================================

on:
  workflow_call:
    inputs:
      source-repo:
        description: '发布 Go 工具链的仓库(格式 owner/repo);留空默认调用方当前仓库,跨仓库请务必传入'
        required: false
        type: string
        default: ''
      tag:
        description: '指定 Release tag;留空则部署最新 Release'
        required: false
        type: string
        default: ''
      install-dir:
        description: 'GOROOT 安装目录(需与发布包 GOROOT_FINAL 一致,默认 /usr/local/go)'
        required: false
        type: string
        default: '/usr/local/go'
    outputs:
      go-version:
        description: '部署的 Go 版本(go version 输出)'
        value: ${{ jobs.deploy.outputs.go_version }}
      go-root:
        description: 'GOROOT 安装目录'
        value: ${{ jobs.deploy.outputs.go_root }}
      release-url:
        description: '部署的 Release 页面链接'
        value: ${{ jobs.deploy.outputs.release_url }}
      tag:
        description: '部署的 Release tag 名'
        value: ${{ jobs.deploy.outputs.tag }}

permissions:
  contents: read

jobs:
  deploy:
    name: 部署 Go 工具链至全局
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go_version:  ${{ steps.deploy.outputs.go_version }}
      go_root:     ${{ steps.deploy.outputs.go_root }}
      release_url: ${{ steps.deploy.outputs.release_url }}
      tag:         ${{ steps.deploy.outputs.tag }}
    env:
      SOURCE_REPO: ${{ inputs.source-repo }}
      TAG_ARG:     ${{ inputs.tag }}
      INSTALL_DIR: ${{ inputs.install-dir }}
      GH_TOKEN:    ${{ github.token }}
    steps:
      - name: 下载并部署最新 Go 工具链 Release
        id: deploy
        run: |
          # 中文彩色日志工具
          C_RESET=$'\033[0m'; C_BOLD=$'\033[1m'
          C_RED=$'\033[31m'; C_GREEN=$'\033[32m'; C_YELLOW=$'\033[33m'
          C_BLUE=$'\033[34m'; C_MAGENTA=$'\033[35m'; C_CYAN=$'\033[36m'
          info()  { printf '  %s■ %s%s\n' "$C_BLUE"  "$C_RESET" "$*"; }
          ok()    { printf '  %s✔ %s%s\n' "$C_GREEN" "$C_RESET" "$*"; }
          warn()  { printf '  %s⚠ %s%s\n' "$C_YELLOW" "$C_RESET" "$*"; }
          err()   { printf '  %s✘ %s%s\n' "$C_RED" "$C_RESET" "$*" >&2; }
          section(){ local t="$*" line="" i; for ((i=0;i<${#t};i++)); do line+="━"; done; \
                     printf '\n%s━━ %s ━━%s\n' "$C_MAGENTA$C_BOLD" "$t" "$C_RESET"; }
          set -euo pipefail

          # 平台匹配检查: 发布工具链仅支持 linux/amd64,其他平台拒绝部署
          check_platform() {
            local os_name arch
            os_name="$(uname -s)"; arch="$(uname -m)"
            case "$arch" in
              x86_64|amd64)            arch="amd64" ;;
              aarch64|arm64)           arch="arm64" ;;
              i386|i486|i586|i686|x86) arch="386" ;;
            esac
            if [ "$os_name" != "Linux" ] || [ "$arch" != "amd64" ]; then
              err "当前运行环境: ${os_name}/${arch}"
              err "本仓库发布的 Go 工具链仅支持 linux/amd64 (x86-64)。"
              err "请在 linux/amd64 runner 上调用(如 runs-on: ubuntu-latest),本步骤将拒绝在其它平台部署。"
              return 1
            fi
            ok "运行环境匹配: Linux/amd64 (x86-64)"
          }

          section "部署 Go 工具链 · linux/amd64"

          # runner 平台校验: 非 linux/amd64 立即拒绝,避免在其他平台误用
          check_platform

          # 定位 Release (REST API,字段固定 snake_case)
          REPO="${SOURCE_REPO:-$GITHUB_REPOSITORY}"
          [ -n "$REPO" ] || { err "未指定发布仓库 (inputs.source-repo)"; exit 1; }

          TAG="${TAG_ARG:-}"
          REL_JSON=""
          if [ -n "$TAG" ]; then
            info "加载指定 Release: $REPO / tag=$TAG"
            REL_JSON="$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>/dev/null || true)"
          else
            info "加载最新 Release: $REPO"
            REL_JSON="$(gh api "repos/${REPO}/releases/latest" 2>/dev/null || true)"
          fi

          if [ -z "$REL_JSON" ]; then
            err "无法获取该 Release 信息(仓库=$REPO tag=${TAG:-latest})。"
            err "请确认: 仓库名正确、该 release 已发布、GITHUB_TOKEN 有读取权限。"
            exit 1
          fi

          TAG="$(printf '%s' "$REL_JSON" | jq -r '.tag_name' 2>/dev/null || true)"
          RELEASE_URL="$(printf '%s' "$REL_JSON" | jq -r '.html_url' 2>/dev/null || true)"
          ASSET_URL="$(printf '%s' "$REL_JSON" | jq -r \
                        '.assets[] | select(.name|endswith(".linux-amd64.tar.gz")) | .browser_download_url' \
                        2>/dev/null | head -n1 || true)"

          if [ -z "$ASSET_URL" ]; then
            err "未在该 Release 中找到 *linux-amd64.tar.gz 资产(仓库=$REPO tag=${TAG:-最新的})。"
            err "请确认发布流程已成功上传资产(压缩包 + .sha256)。"
            exit 1
          fi

          ok "定位 Release: $TAG"
          info "资产: ${ASSET_URL##*/}"

          # 下载并校验 SHA256
          info "下载发布包 ..."
          TMP="$RUNNER_TEMP/go-deploy"; rm -rf "$TMP"; mkdir -p "$TMP"
          curl -fsSL "$ASSET_URL" -o "$TMP/go.tar.gz"
          ACTUAL="$(sha256sum "$TMP/go.tar.gz" | awk '{print $1}')"
          EXPECT="$(curl -fsSL "${ASSET_URL}.sha256" 2>/dev/null | awk '{print $1}' || true)"
          if [ -n "$EXPECT" ]; then
            [ "$ACTUAL" = "$EXPECT" ] || { err "SHA256 校验失败! 期望=$EXPECT 实际=$ACTUAL"; exit 1; }
            ok "SHA256 校验通过: $ACTUAL"
          else
            warn "未获取到官方 sha256,跳过校验(实际=$ACTUAL)"
          fi

          # 安装到全局目录
          info "安装到 $INSTALL_DIR ..."
          tar -C "$TMP" -xzf "$TMP/go.tar.gz"
          sudo rm -rf "$INSTALL_DIR"
          sudo mkdir -p "$(dirname "$INSTALL_DIR")"
          sudo mv "$TMP/go" "$INSTALL_DIR"

          # 写入 PATH / GOROOT(本 workflow 自身 job 后续步骤生效)
          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$INSTALL_DIR" >> "$GITHUB_ENV"

          GO_VER="$("$INSTALL_DIR/bin/go" version)"
          ok "go version → $GO_VER"
          info "GOROOT → $("$INSTALL_DIR/bin/go" env GOROOT)"
          info "GOOS/GOARCH → $("$INSTALL_DIR/bin/go" env GOOS) / $("$INSTALL_DIR/bin/go" env GOARCH)"

          echo "go_version=$GO_VER"       >> "$GITHUB_OUTPUT"
          echo "go_root=$INSTALL_DIR"     >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"                 >> "$GITHUB_OUTPUT"

          ok "完成。调用方可使用 outputs.go-root 在后续 job 中启用 go(PATH)"